# Site settings
title: LeedsPHP - A PHP user group in Leeds, UK.
description: "A minimal blog template, build with Jekyll."
url: "http://www.jacoporabolini.com/emerald"
author:
  name: "Jacopo Rabolini"
  email: "hello@jacoporabolini.com"
  url: "http://www.jacoporabolini.com"

# Build settings
baseurl: / # Change this to your relative path (ex: /blog/), or leave just a /
markdown: kramdown
source: .
destination: ./_site
permalink: /:title/

# Pagination
gems: [jekyll-paginate]
paginate: 8
paginate_path: "/archive/page/:num"

# Default values
defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Options
reverse: false

sponsors: 
  - name: Acentrix
    website: "https://acentrix.co.uk/"
    logo: "acentrix_logo.png"
    description: ""
    current: true

socials:
  - name: LinkedIn
    link: "https://www.linkedin.com/company/leedsphp"
    imagePath: "linkedin.png"
    footerImagePath: "linkedin-footer-logo.png"
    contactUsHere: true
  - name: Mastodon
    link: "https://mastodon.social/@LeedsPHP@phpc.social"
    imagePath: "mastodon.png"
    footerImagePath: "mastodon-footer-logo.png"
    contactUsHere: true
  - name: Bluesky
    link: "https://bsky.app/profile/leedsphp.bsky.social"
    imagePath: "bluesky.png"
    footerImagePath: "bluesky-footer-logo.png"
    contactUsHere: true
  - name: X
    link: "https://x.com/leedsphp"
    imagePath: "x.jpg"
    footerImagePath: "x-footer-logo.png"
    contactUsHere: true