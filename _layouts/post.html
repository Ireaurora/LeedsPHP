---
layout: default
---
<article id="post-page" class="talk-page">
	<a class="talk-back-link" href="/archive/"><span aria-hidden="true">&larr;</span> All talks</a>
	<div class="talk-page-card">
		<div class="talk-page-heading">
			<h1>{{ page.title }}</h1>
		</div>
		<div class="content talk-content{% if page.meetup_event_id %} has-rsvp{% endif %}">
			{{ content }}
		</div>
		{% if page.meetup_event_id %}
		<div class="talk-page-rsvp">
			<a class="meetup-rsvp-button" href="https://www.meetup.com/leedsphp/events/{{ page.meetup_event_id }}/">RSVP on Meetup</a>
		</div>
		{% endif %}
	</div>
</article>
